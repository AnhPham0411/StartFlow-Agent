services:
  backend:
    pull_policy: never
    ports: !override
      - '127.0.0.1:${BACKEND_PORT:-3201}:3001'
    volumes:
      - type: bind
        source: ${POSTGRES_CA_CERT_PATH:-/dev/null}
        target: /run/secrets/postgres-ca.crt
        read_only: true

  ai-service:
    pull_policy: never
    volumes:
      - type: bind
        source: ${POSTGRES_CA_CERT_PATH:-/dev/null}
        target: /run/secrets/postgres-ca.crt
        read_only: true

  frontend:
    pull_policy: never
    build:
      args:
        STARTFLOW_BUILD_CONFIGURATION: production
    ports: !override
      - '127.0.0.1:${FRONTEND_PORT:-3200}:3000'

  backend-migrate:
    pull_policy: never
    volumes:
      - type: bind
        source: ${POSTGRES_CA_CERT_PATH:-/dev/null}
        target: /run/secrets/postgres-ca.crt
        read_only: true

  backend-profile-seed:
    image: ${STARTFLOW_BACKEND_IMAGE:-startflow-backend:local}
    pull_policy: never
    env_file:
      - path: ${STARTFLOW_ENV_FILE:-.env}
        required: false
    environment:
      AI_SERVICE_URL: http://ai-service:8000
      PORT: 3001
    networks:
      - startflow
    profiles: [tools]
    command: ['pnpm', '--filter', '@startflow/backend', 'profile:seed']
    restart: 'no'
    volumes:
      - type: bind
        source: ${POSTGRES_CA_CERT_PATH:-/dev/null}
        target: /run/secrets/postgres-ca.crt
        read_only: true

  backend-identity-seed:
    image: ${STARTFLOW_BACKEND_IMAGE:-startflow-backend:local}
    pull_policy: never
    env_file:
      - path: ${STARTFLOW_ENV_FILE:-.env}
        required: false
    environment:
      AI_SERVICE_URL: http://ai-service:8000
      PORT: 3001
    networks:
      - startflow
    profiles: [tools]
    command: ['pnpm', '--filter', '@startflow/backend', 'identity:seed']
    restart: 'no'
    volumes:
      - type: bind
        source: ${POSTGRES_CA_CERT_PATH:-/dev/null}
        target: /run/secrets/postgres-ca.crt
        read_only: true

  ai-migrate:
    pull_policy: never
    volumes:
      - type: bind
        source: ${POSTGRES_CA_CERT_PATH:-/dev/null}
        target: /run/secrets/postgres-ca.crt
        read_only: true

  ai-seed:
    pull_policy: never
    volumes:
      - type: bind
        source: ${POSTGRES_CA_CERT_PATH:-/dev/null}
        target: /run/secrets/postgres-ca.crt
        read_only: true

networks:
  startflow:
    name: ${STARTFLOW_NETWORK:-startflow-prod}
    external: true
