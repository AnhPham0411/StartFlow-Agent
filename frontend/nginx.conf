worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp_path;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 3000;
        listen [::]:3000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        set $startflow_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'sha256-0zZPgsifJ8h8aM+gmSxkrfNtAGUZb7ItVug6/j1UR5g='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https:; worker-src 'self' blob:; form-action 'self' https:; manifest-src 'self'; upgrade-insecure-requests";

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "$startflow_csp" always;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Retired runtime configuration path must not fall through to the Angular shell.
        location = /app-config.json {
            return 404;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "$startflow_csp" always;
        }

        location ~* \.html$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "$startflow_csp" always;
            try_files $uri =404;
        }

        location ~* "/[^/]+-[a-z0-9]{8,}\.(?:js|mjs)$" {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "$startflow_csp" always;
            try_files $uri =404;
        }

        location ~* \.(?:css|js|mjs|map|ico|gif|jpe?g|png|svg|webp|woff2?)$ {
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "$startflow_csp" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
