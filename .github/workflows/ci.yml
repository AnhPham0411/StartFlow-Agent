name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: startflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node quality and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:prepare
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    name: Python quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.1'
          enable-cache: true
      - run: uv sync --frozen
        working-directory: ai-service
      - run: uv run ruff check .
        working-directory: ai-service
      - run: uv run mypy src
        working-directory: ai-service
      - run: uv run pytest
        working-directory: ai-service

  e2e:
    name: Critical UI journeys
    runs-on: ubuntu-latest
    needs: [node]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:prepare
      - run: pnpm --filter @startflow/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  docker:
    name: Compose and image build
    runs-on: ubuntu-latest
    needs: [node, python, e2e]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Build application images
        run: docker compose --env-file .env.example build

  secret-safety:
    name: Secret and contract safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject committed runtime env and private keys
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$'; then
            echo 'A runtime env file is tracked.' >&2
            exit 1
          fi
          if git ls-files | grep -E '\.(key|pem|p12|pfx)$'; then
            echo 'Private key material is tracked.' >&2
            exit 1
          fi
      - name: Check immutable contract vocabulary
        run: node --test test/contracts/*.test.mjs

  deployment-assets:
    name: Independent deployment assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate scripts and deployment contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n infra/deploy/prepare-env.sh
          bash -n infra/deploy/deploy.sh
          bash -n backend/entrypoint.sh
          bash -n ai-service/entrypoint.sh
          bash infra/deploy/tests/prepare-env.test.sh
          bash infra/deploy/tests/deploy.test.sh
          bash infra/deploy/tests/workflow.test.sh
