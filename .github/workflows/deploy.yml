name: Deploy StartFlow

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: startflow-deploy-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'
      )
    name: Deploy ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'development' }}
    runs-on: ubuntu-latest
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'development' }}
    env:
      TARGET_ENV: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'prod' || 'dev' }}
      FRONTEND_BUILD_CONFIGURATION: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'development' }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DROPLET_ROOT: ${{ vars.STARTFLOW_DROPLET_ROOT || '/opt/startflow-agent' }}
    steps:
      - name: Checkout StartFlow
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate deployment assets
        shell: bash
        run: |
          set -euo pipefail
          bash -n infra/deploy/prepare-env.sh
          bash -n infra/deploy/deploy.sh
          bash infra/deploy/tests/prepare-env.test.sh
          bash infra/deploy/tests/deploy.test.sh
          bash infra/deploy/tests/workflow.test.sh

      - name: Select isolated release root
        shell: bash
        run: |
          set -euo pipefail
          is_safe_absolute_path() {
            local path="$1" segment
            local -a segments
            [[ "$path" =~ ^/[A-Za-z0-9._/-]+$ ]] || return 1
            [[ "$path" != '/' && "$path" != */ && "$path" != *'//'* ]] || return 1
            IFS='/' read -r -a segments <<< "${path#/}"
            for segment in "${segments[@]}"; do
              [[ -n "$segment" && "$segment" != '.' && "$segment" != '..' ]] || return 1
            done
          }

          is_safe_absolute_path "$DROPLET_ROOT" || {
            printf 'Unsafe STARTFLOW_DROPLET_ROOT: use an absolute path without empty, dot, or dot-dot segments.\n' >&2
            exit 2
          }
          droplet_path="$DROPLET_ROOT/$TARGET_ENV"
          is_safe_absolute_path "$droplet_path" || {
            printf 'Unsafe derived DROPLET_PATH.\n' >&2
            exit 2
          }
          printf 'DROPLET_PATH=%s/%s\n' "$DROPLET_ROOT" "$TARGET_ENV" >> "$GITHUB_ENV"

      - name: Prepare runtime environment
        shell: bash
        env:
          STARTFLOW_RUNTIME_ENV: ${{ secrets.STARTFLOW_ENV }}
          POSTGRES_CA_CERT_BASE64: ${{ secrets.POSTGRES_TLS_CA_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .deploy
          OUTPUT_ENV="$GITHUB_WORKSPACE/.deploy/.env" \
          OUTPUT_CA="$GITHUB_WORKSPACE/.deploy/postgres-ca.crt" \
            bash infra/deploy/prepare-env.sh

          image_tag="${RELEASE_SHA::12}"
          {
            printf '\nSTARTFLOW_BACKEND_IMAGE=startflow-backend:%s\n' "$image_tag"
            printf 'STARTFLOW_FRONTEND_IMAGE=startflow-frontend:%s\n' "$image_tag"
            printf 'STARTFLOW_AI_IMAGE=startflow-ai:%s\n' "$image_tag"
            printf 'COMPOSE_PROJECT_NAME=startflow-%s\n' "$TARGET_ENV"
          } >> .deploy/.env
          chmod 600 .deploy/.env
          printf 'IMAGE_TAG=%s\n' "$image_tag" >> "$GITHUB_ENV"

      - name: Build immutable images
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --file backend/Dockerfile \
            --tag "startflow-backend:$IMAGE_TAG" \
            .

          docker build \
            --file frontend/Dockerfile \
            --build-arg "STARTFLOW_BUILD_CONFIGURATION=$FRONTEND_BUILD_CONFIGURATION" \
            --tag "startflow-frontend:$IMAGE_TAG" \
            .

          docker build \
            --file ai-service/Dockerfile \
            --tag "startflow-ai:$IMAGE_TAG" \
            .

          docker save \
            "startflow-backend:$IMAGE_TAG" \
            "startflow-frontend:$IMAGE_TAG" \
            "startflow-ai:$IMAGE_TAG" | gzip -1 > .deploy/images.tar.gz

      - name: Configure strict SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DROPLET_SSH_KNOWN_HOSTS: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DROPLET_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          test -s ~/.ssh/id_ed25519
          test -s ~/.ssh/known_hosts

      - name: Upload release bundle
        id: upload_release
        shell: bash
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          set -euo pipefail
          is_safe_absolute_path() {
            local path="$1" segment
            local -a segments
            [[ "$path" =~ ^/[A-Za-z0-9._/-]+$ ]] || return 1
            [[ "$path" != '/' && "$path" != */ && "$path" != *'//'* ]] || return 1
            IFS='/' read -r -a segments <<< "${path#/}"
            for segment in "${segments[@]}"; do
              [[ -n "$segment" && "$segment" != '.' && "$segment" != '..' ]] || return 1
            done
          }

          is_safe_absolute_path "$DROPLET_PATH" || {
            printf 'Unsafe DROPLET_PATH.\n' >&2
            exit 2
          }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          remote_archive="$DROPLET_PATH/release/release-$RELEASE_SHA.tar.gz"
          ssh -o BatchMode=yes "$DROPLET_USER@$DROPLET_HOST" \
            "set -eu; test ! -L '$DROPLET_PATH/release'; install -d -m 700 '$DROPLET_PATH/release'"
          cp docker-compose.yml .deploy/docker-compose.yml
          cp docker-compose.prod.yml .deploy/docker-compose.prod.yml
          cp infra/deploy/deploy.sh .deploy/deploy.sh
          cp -R infra/deploy/nginx .deploy/nginx
          release_files=(.env images.tar.gz docker-compose.yml docker-compose.prod.yml deploy.sh nginx)
          if [[ -f .deploy/postgres-ca.crt ]]; then
            release_files+=(postgres-ca.crt)
          fi
          tar -C .deploy -czf .deploy/release.tar.gz "${release_files[@]}"
          chmod 600 .deploy/release.tar.gz
          scp -p -o BatchMode=yes .deploy/release.tar.gz \
            "$DROPLET_USER@$DROPLET_HOST:$remote_archive"
          ssh -o BatchMode=yes "$DROPLET_USER@$DROPLET_HOST" "chmod 600 '$remote_archive'"

      - name: Migrate, deploy, and verify
        shell: bash
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$DROPLET_USER@$DROPLET_HOST" \
            "DROPLET_PATH='$DROPLET_PATH' RELEASE_SHA='$RELEASE_SHA' TARGET_ENV='$TARGET_ENV' bash -se" \
            < infra/deploy/deploy.sh

      - name: Remove uploaded release archive
        if: always() && steps.upload_release.outcome == 'success'
        shell: bash
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          set -euo pipefail
          [[ "$DROPLET_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DROPLET_PATH" != '/' && "$DROPLET_PATH" != */ && "$DROPLET_PATH" != *'//'* ]]
          case "/${DROPLET_PATH#/}/" in
            *'/./'*|*'/../'*) exit 2 ;;
          esac
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote_archive="$DROPLET_PATH/release/release-$RELEASE_SHA.tar.gz"
          ssh -o BatchMode=yes "$DROPLET_USER@$DROPLET_HOST" "rm -f -- '$remote_archive'"
